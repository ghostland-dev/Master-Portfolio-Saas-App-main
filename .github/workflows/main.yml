name: Unified CI/CD Pipeline

on:
  push:
    branches: [ main, staging, dev ]
  pull_request:
    branches: [ main, staging, dev ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/portfolio-saas-frontend

jobs:
  # 1. PRE-COMMIT & LINT
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Run linting
        run: cd frontend && npm run lint || echo "Linting failed but continuing..."
      - name: Run type checking
        run: cd frontend && npm run type-check || echo "Type check failed but continuing..."

  # 2. TESTS
  test:
    name: Unit & Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Run tests
        run: cd frontend && npm test -- --coverage --watchAll=false
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

  # 3. SECURITY
  security:
    name: Security Scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit NPM Dependencies
        run: cd frontend && npm audit --audit-level=high || echo "Audit found vulnerabilities"
      - name: Run Trivy SAST scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # 4. BUILD & ARTIFACT
  build:
    name: Build & Push Docker Image
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Determine Environment Config
        id: config
        run: |
          # Set Tag
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then 
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "domain=${{ secrets.DOMAIN }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then 
            echo "tag=staging" >> $GITHUB_OUTPUT
            echo "domain=staging.${{ secrets.DOMAIN }}" >> $GITHUB_OUTPUT
          else 
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "domain=dev.${{ secrets.DOMAIN }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.config.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://${{ steps.config.outputs.domain }}/api
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 5. DEPLOY
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy production files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,deploy/kong.yml,backend/supabase/*.sql"
          target: "~/Apps/portfolio-saas/${{ github.ref_name }}"
          strip_components: 0

      - name: Execute Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd "~/Apps/portfolio-saas/${{ github.ref_name }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # Determine domain based on branch (same logic as build)
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              ENV_DOMAIN="${{ secrets.DOMAIN }}"
            elif [[ "${{ github.ref_name }}" == "staging" ]]; then
              ENV_DOMAIN="staging.${{ secrets.DOMAIN }}"
            else
              ENV_DOMAIN="dev.${{ secrets.DOMAIN }}"
            fi

            cat > .env << EOF
            GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            DOMAIN=$ENV_DOMAIN
            ANON_KEY=${{ secrets.ANON_KEY }}
            SERVICE_ROLE_KEY=${{ secrets.SERVICE_ROLE_KEY }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB || 'postgres' }}_${{ github.ref_name }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRY=${{ secrets.JWT_EXPIRY || '3600' }}
            REALTIME_SECRET_KEY_BASE=${{ secrets.REALTIME_SECRET_KEY_BASE }}
            EOF
            
            # Pull latest images
            docker compose -f docker-compose.prod.yml -p "portfolio-${{ github.ref_name }}" pull
            
            # Restart services with isolated project name
            docker compose -f docker-compose.prod.yml -p "portfolio-${{ github.ref_name }}" up -d --remove-orphans
            
            # Cleanup old images
            docker image prune -f

            echo "Deployment to $ENV_DOMAIN successful!"

  # 6. NOTIFY
  notify:
    name: Notification
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ (github.ref == 'refs/heads/main' && 'Production') || (github.ref == 'refs/heads/staging' && 'Staging') || 'Development' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "- **Deployment**: Success 🚀" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Deployment**: Failed or Skipped ⚠️" >> $GITHUB_STEP_SUMMARY
          fi
